version: '3.8'
services:
  db_postgres:
    image: bitnami/postgresql:latest
    container_name: db_postgres
    restart: always
    environment:
      POSTGRESQL_USERNAME: hirowf
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/bitnami/postgresql
volumes:
  postgres_data:
    driver: local
